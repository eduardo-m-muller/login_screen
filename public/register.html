<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- icones, o olhinho da senha vem daqui -->
    <link rel="stylesheet" href="https://cdn.linearicons.com/free/1.0.0/icon-font.min.css">

    <!-- mesmo css do login -->
    <link rel="stylesheet" href="style.css">

    <title>CloudNest | Cadastro</title>
</head>
<body>

    <!-- mesma estrutura do login -->
    <div id="body-container">

        <h2>CloudNest</h2>

        <input type="text" id="username-register" placeholder="nome de usuario">

        <div class="password-field">
            <input type="password" id="password-register" placeholder="senha">
            <span class="lnr lnr-eye"></span>
        </div>

        <!-- o olho de cima so mexe no campo de senha, esse aqui fica sem -->
        <input type="password" id="confirm-password" placeholder="confirmar senha">

        <!-- botoes -->
        <div id="button">
            <button type="submit" id="register-button">cadastrar</button>
            <!-- volta pra pagina anterior (login) -->
            <button onclick="history.back()">Voltar</button>
        </div>

    </div>

    <script src="olho.js"></script>
    <script src="account.js"></script>

</body>
</html>
