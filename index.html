<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonte de ícones (o olhinho da senha vem daqui) -->
    <link rel="stylesheet" href="https://cdn.linearicons.com/free/1.0.0/icon-font.min.css">

    <!-- Liga o arquivo de estilo (style.css) a esta página -->
    <link rel="stylesheet" href="style.css">

    <!-- Texto que aparece na aba do navegador -->
    <title>Document</title>
</head>
<body>

    <!-- Caixa central da tela de login: tudo fica dentro dela -->
    <div id="body-container">

        <!-- Título -->
        <h2>CloudNest</h2>

        <!-- Campo de usuário -->
        <input type="text" id="username" placeholder="nome de usuario">

        <!-- Campo de senha + olhinho.
             A div existe pra que o ícone possa se posicionar dentro do campo. -->
        <div class="password-field">
            <input type="password" id="password" placeholder="senha">
            <span class="lnr lnr-eye"></span>
        </div>

        <!-- Botões -->
        <div id="button">
            <button type="submit" id="entrarBtn">entrar</button>
        <a href="register.html">
            <button type="submit" id="register-button">cadastrar-se</button>
        </a>
        </div>

    </div>

    <!-- Liga o arquivo de script (script.js). Fica no fim do body
         pra que os elementos acima já existam quando o JS rodar. -->
    <script src="JavaScript/olho.js"></script>
    <script src="JavaScript/account.js"></script>

</body>
</html>
